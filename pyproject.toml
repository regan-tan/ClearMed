[project]
name = "clearmed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "regan-tan-enzo", email = "regan@heyenzo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "bert-score>=0.3.13",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "peft>=0.21.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
clearmed = "clearmed:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
