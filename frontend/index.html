<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#27634d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearMed Study</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Without a saved choice, follow the system setting.
      try {
        const saved = localStorage.getItem('clearmed-theme')
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
